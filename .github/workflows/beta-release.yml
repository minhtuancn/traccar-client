name: Beta Release

on:
  push:
    branches:
      - 'beta/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  android-beta:
    name: Build and publish Android beta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve beta version
        id: version
        shell: bash
        run: |
          FULL_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          VERSION=${FULL_VERSION%%+*}
          if [[ "$VERSION" != *-beta.* ]]; then
            echo "pubspec version must be a beta version, got: $FULL_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=zalgps-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Reject an already published beta tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Tag $RELEASE_TAG already exists. Increment the beta version."
            exit 1
          else
            code=$?
            [[ "$code" == 2 ]] || exit "$code"
          fi

      - name: Verify pinned SDK core
        working-directory: vendor/traccar-client-sdk
        run: ./gradlew :core:allTests --no-configuration-cache

      - name: Flutter dependencies
        run: flutter pub get

      - name: Install branding renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Generate ZalGps launcher icons
        run: ./tool/generate_branding.sh

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Build signed beta APK
        shell: bash
        env:
          ZALGPS_KEYSTORE_BASE64: ${{ secrets.ZALGPS_KEYSTORE_BASE64 }}
          ZALGPS_KEYSTORE_PASSWORD: ${{ secrets.ZALGPS_KEYSTORE_PASSWORD }}
          ZALGPS_KEY_ALIAS: ${{ secrets.ZALGPS_KEY_ALIAS }}
          ZALGPS_KEY_PASSWORD: ${{ secrets.ZALGPS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ZALGPS_KEYSTORE_BASE64 ZALGPS_KEYSTORE_PASSWORD ZALGPS_KEY_ALIAS ZALGPS_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing signing secret $name"; exit 1; }
          done
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/zalgps-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          export ZALGPS_SIGNING_PROPERTIES="$signing_dir/key.properties"
          export ZALGPS_KEYSTORE_PATH="$signing_dir/zalgps.p12"
          printf '%s' "$ZALGPS_KEYSTORE_BASE64" | base64 --decode > "$ZALGPS_KEYSTORE_PATH"
          python3 - <<'PY'
          import os
          from pathlib import Path
          def escape(value):
              return ''.join('\\u%04x' % ord(ch) if ord(ch) <= 0xffff else ''.join('\\u%04x' % int.from_bytes(ch.encode('utf-16-be')[i:i+2], 'big') for i in (0, 2)) for ch in value)
          values = {
              'storeFile': os.environ['ZALGPS_KEYSTORE_PATH'],
              'storePassword': os.environ['ZALGPS_KEYSTORE_PASSWORD'],
              'keyAlias': os.environ['ZALGPS_KEY_ALIAS'],
              'keyPassword': os.environ['ZALGPS_KEY_PASSWORD'],
          }
          Path(os.environ['ZALGPS_SIGNING_PROPERTIES']).write_text(''.join(k+'='+escape(v)+'\n' for k,v in values.items()), encoding='ascii')
          PY
          keytool -exportcert -keystore "$ZALGPS_KEYSTORE_PATH" -storepass:env ZALGPS_KEYSTORE_PASSWORD -alias "$ZALGPS_KEY_ALIAS" -file "$signing_dir/cert.der"
          expected=$(sha256sum "$signing_dir/cert.der" | cut -d' ' -f1)
          unset ZALGPS_KEYSTORE_BASE64 ZALGPS_KEYSTORE_PASSWORD ZALGPS_KEY_ALIAS ZALGPS_KEY_PASSWORD
          flutter build apk --release
          apksigner=$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > "$signing_dir/verification.txt" 2>&1
          cat "$signing_dir/verification.txt"
          actual=$(python3 - "$signing_dir/verification.txt" <<'PY'
          import re
          import sys
          from pathlib import Path
          report = Path(sys.argv[1]).read_text()
          fingerprints = []
          for line in report.splitlines():
              if re.search(r'certificate\s+SHA[- ]?256(?:\s+digest)?\s*:', line, re.I):
                  fingerprint = re.sub(r'[:\s]', '', line.split(':', 1)[1]).lower()
                  if re.fullmatch(r'[0-9a-f]{64}', fingerprint):
                      fingerprints.append(fingerprint)
          if len(fingerprints) != 1:
              sys.exit("Expected exactly one APK signer certificate SHA-256 fingerprint")
          print(fingerprints[0])
          PY
          )
          [[ "$actual" == "$expected" ]] || { echo "::error::APK signing certificate mismatch (expected $expected, actual $actual)"; exit 1; }
          printf '%s\n' "$actual" > signing-certificate.sha256
          echo "Verified ZalGps signing certificate SHA-256: $actual"

      - name: Prepare release files
        shell: bash
        run: |
          APK="${{ steps.version.outputs.apk }}"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"

          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK")
          cp docs/BETA_RELEASE.md release-notes.md
          printf '\n## CI artifact for this release\n\n' >> release-notes.md
          printf -- '- Workflow: `Beta Release`\n' >> release-notes.md
          printf -- '- Run ID: `%s`\n' "$GITHUB_RUN_ID" >> release-notes.md
          printf -- '- Commit: `%s`\n' "$GITHUB_SHA" >> release-notes.md
          printf -- '- APK: `%s`\n' "$APK" >> release-notes.md
          printf -- '- APK size: `%s` bytes\n' "$APK_SIZE" >> release-notes.md
          printf -- '- APK SHA-256: `%s`\n' "$APK_SHA" >> release-notes.md
          printf -- '- Signing certificate SHA-256: `%s`\n' "$(cat signing-certificate.sha256)" >> release-notes.md

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: zalgps-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ZalGps ${{ steps.version.outputs.version }}
          prerelease: true
          draft: false
          body_path: release-notes.md
          files: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
